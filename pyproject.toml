[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "french-typo"
version = "1.2.0"
description = "Moteur de correction typographique française"
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.8"
dependencies = ["click>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0", "python-semantic-release>=9,<10"]

[project.scripts]
french-typo = "french_typo.cli:fix"

[tool.setuptools.packages.find]
where = ["."]
include = ["french_typo*"]
exclude = ["tests*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["french_typo/__init__.py:__version__"]
branch = "main"
# Commits gitmoji : le parser "emoji" est obligatoire ("angular" ne parse pas un en-tête
# préfixé d'un emoji -> aucun bump, aucune erreur). Voir repos-meta/CLI_STANDARDS.md.
commit_parser = "emoji"
major_on_zero = false
tag_format = "v{version}"
# [skip ci] : évite que le commit de release redéclenche un run.
commit_message = "🔖 chore(release): {version} [skip ci]"

[tool.semantic_release.commit_parser_options]
major_tags = ["💥"]
minor_tags = ["✨"]
patch_tags = ["🐛", "🚑", "⚡", "🔒"]

[tool.semantic_release.changelog]
exclude_commit_patterns = []

[tool.semantic_release.branches.main]
match = "main"
prerelease = false
